name: Check and package Serve and Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Client/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - name: Install locked Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.90.0
      - run: npm ci
      - run: npm ci
        working-directory: Client
      - run: uv sync --frozen
      - run: npm run check
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
      - run: npx playwright install --with-deps chromium
        working-directory: Client
      - run: npm run check
        working-directory: Client
      - run: npm run test:python
        working-directory: Client
      - run: npm run test:python:browser
        working-directory: Client
      - name: Build portable application bundles
        run: bash deploy/build-release.sh
      - name: Install Serve offline, migrate state and start its HTTP service
        run: python deploy/test-release.py artifacts/release/Serve.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: Serve
          path: |
            artifacts/release/Serve.tar.gz
            artifacts/release/Serve.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Client
          path: |
            artifacts/release/Client.zip
            artifacts/release/Client.zip.sha256
          if-no-files-found: error
