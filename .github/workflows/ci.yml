name: checks

on:
  push:
    branches: [dev, master]
  pull_request:

permissions:
  contents: read

jobs:
  foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run check
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
